name: Weekly GitHub health check

# Every Sunday (the first day of the week in Israel) this checks all of
# Kevin's public repositories: CI on main, open pull requests and issues, and
# the last week's commits for secrets, absolute local paths and Spanish code
# comments. Read-only. A clean week stays green; anything that needs attention
# turns the run red, and GitHub emails the owner with the report.

on:
  # GitHub cron runs in UTC and Israel moves between UTC+2 and UTC+3, so both
  # candidate times are scheduled and the gate step below keeps only the one
  # that is 06:00 in Jerusalem on that day. Scheduled runs can start a few
  # minutes late when GitHub is busy.
  schedule:
    - cron: "0 3 * * 0" # 06:00 Israel in summer time (UTC+3)
    - cron: "0 4 * * 0" # 06:00 Israel in winter time (UTC+2)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-health-${{ github.repository }}
  cancel-in-progress: false

jobs:
  health:
    name: Check every public repository
    if: github.repository == 'LiriothTeltanion/LiriothTeltanion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keep only the run that is 06:00 in Israel
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset="$(TZ=Asia/Jerusalem date +%z)"
          run=true
          if [ -n "$SCHEDULE" ]; then
            case "$offset|$SCHEDULE" in
              "+0300|0 3 * * 0" | "+0200|0 4 * * 0") run=true ;;
              *) run=false ;;
            esac
          fi
          echo "Israel UTC offset $offset, schedule '${SCHEDULE:-manual}', run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Check out profile repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Run the weekly health check
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/weekly_health.py --days 8
