name: Audit Nova Music Lab profile release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-project-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    name: Detect deployed Nova Music Lab evidence drift
    if: github.repository == 'LiriothTeltanion/LiriothTeltanion'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Audit the live Pages manifest and commit-pinned media
        run: python scripts/sync_nova_music_lab.py

      - name: Verify the read-only sync contract
        run: |
          python -m unittest tests.test_nova_music_lab_sync -v
          git diff --exit-code
          git diff --check
