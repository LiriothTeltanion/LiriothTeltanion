name: External link audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-link-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-links:
    name: Check public profile links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Compile link-audit tooling
        run: python -m compileall -q scripts/check_external_links.py

      - name: Audit published external links
        run: python scripts/check_external_links.py --timeout 15
