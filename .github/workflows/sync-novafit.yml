name: Audit NovaFit portfolio facts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: profile-project-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    name: Detect NovaFit profile evidence drift
    if: github.repository == 'LiriothTeltanion/LiriothTeltanion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MANIFEST_URL: https://raw.githubusercontent.com/LiriothTeltanion/NovaFit/main/portfolio/project.json

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Detect drift from the allow-listed NovaFit manifest
        run: python scripts/sync_novafit.py --url "$MANIFEST_URL" --check

      - name: Verify synchronized profile outputs
        run: |
          python scripts/sync_ivrit_sheli.py --check
          python scripts/sync_novafit.py --check
          python scripts/build_profile.py --mode compact --output README.md --check
          python scripts/build_profile.py --mode expanded --output README_EXPANDED.md --check
          python scripts/validate_profile.py --readme README.md --mode compact --check-localized
          python scripts/validate_profile.py --readme README_EXPANDED.md --mode expanded
          python -m unittest discover -s tests -v
          git diff --check
